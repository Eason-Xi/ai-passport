<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登记昵称 · 限定猜拳</title>
<style>
body { margin: 0; background: #0d0b0a; color: #f3ebdd; font: 17px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 420px; margin: 0 auto; padding: 28px 18px 40px; }
h1 { font-size: 24px; margin: 0 0 6px; }
h1 span { color: #d0232c; }
p { color: #9c8f7e; margin: 6px 0 18px; font-size: 15px; }
.dev { display: inline-block; background: #211b17; border: 1px solid #3d332b; border-radius: 8px; padding: 2px 10px; color: #f2c230; font-weight: 700; letter-spacing: 1px; }
label { display: block; color: #9c8f7e; font-size: 14px; margin-bottom: 6px; }
input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1px solid #3d332b; background: #151210; color: #f3ebdd; font: inherit; font-size: 20px; }
button { margin-top: 16px; width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #d0232c; color: #fff; font: inherit; font-size: 19px; font-weight: 700; }
.err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #3a1517; color: #ffb3b3; font-size: 15px; }
.tip { margin-top: 18px; color: #5e544a; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>给你的 Passport 起个名字 · <span>限定猜拳</span></h1>
  <p>设备 <span class="dev">$device</span> 正在等你登记。昵称会显示在你和对手的屏幕上，以及庄家的名单里。</p>
  <form method="post" action="$action" accept-charset="utf-8">
    <label for="name">昵称（最多 8 个汉字或 16 个字母）</label>
    <input id="name" name="name" value="$value" maxlength="16" autocomplete="nickname" autofocus required>
    <div class="err" style="$error_style">$error</div>
    <button type="submit">登记</button>
  </form>
  <div class="tip">昵称只保存在主持这局游戏的电脑上，不会上传到网上。表情符号和少数生僻字设备显示不了，会提示你换一个。</div>
</main>
</body>
</html>
